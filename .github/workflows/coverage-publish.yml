name: Coverage Publication

on:
  workflow_run:
    workflows: ['Backend CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish trusted main coverage
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Download this successful run's validated report
        uses: actions/download-artifact@v8.0.2
        with:
          name: backend-coverage-report
          path: coverage/report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish if the measured source is still current main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_REF: refs/heads/main
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_CI_RESULT: ${{ github.event.workflow_run.conclusion }}
        run: node tool/coverage/publish.mjs coverage/report/summary.json
